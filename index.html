<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocForge - Professional Document Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <!-- Top Navigation -->
  <nav class="top-nav">
    <div class="nav-brand">
      <i class="fas fa-file-invoice"></i>
      <span>DocForge</span>
    </div>
    <div class="nav-center">
      <div class="view-toggle">
        <button class="toggle-btn active" data-view="simple" onclick="switchView('simple')">
          <i class="fas fa-magic"></i> Simple View
        </button>
        <button class="toggle-btn" data-view="advanced" onclick="switchView('advanced')">
          <i class="fas fa-code"></i> Advanced View
        </button>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-outline" onclick="resetForm()"><i class="fas fa-redo"></i> Reset</button>
      <button class="btn btn-primary" onclick="generatePDF()"><i class="fas fa-file-pdf"></i> Export PDF</button>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-container">
    <!-- ========== SIMPLE VIEW ========== -->
    <div id="simple-view" class="view-panel active">
      <div class="simple-layout">
        <!-- Left Panel: Form -->
        <div class="form-panel">
          <div class="panel-scroll">
            <!-- Document Type -->
            <section class="form-section">
              <h3><i class="fas fa-file-alt"></i> Document Type</h3>
              <div class="doc-type-grid">
                <button class="doc-type-card active" data-type="invoice" onclick="selectDocType('invoice')">
                  <i class="fas fa-file-invoice-dollar"></i>
                  <span>Invoice</span>
                </button>
                <button class="doc-type-card" data-type="utility" onclick="selectDocType('utility')">
                  <i class="fas fa-bolt"></i>
                  <span>Utility Bill</span>
                </button>
                <button class="doc-type-card" data-type="receipt" onclick="selectDocType('receipt')">
                  <i class="fas fa-receipt"></i>
                  <span>Receipt</span>
                </button>
                <button class="doc-type-card" data-type="quote" onclick="selectDocType('quote')">
                  <i class="fas fa-calculator"></i>
                  <span>Quote</span>
                </button>
                <button class="doc-type-card" data-type="statement" onclick="selectDocType('statement')">
                  <i class="fas fa-university"></i>
                  <span>Statement</span>
                </button>
                <button class="doc-type-card" data-type="delivery" onclick="selectDocType('delivery')">
                  <i class="fas fa-truck"></i>
                  <span>Delivery Note</span>
                </button>
              </div>
            </section>

            <!-- Company / Sender Details -->
            <section class="form-section">
              <h3><i class="fas fa-building"></i> Your Company</h3>
              <div class="logo-upload" id="logo-upload" onclick="document.getElementById('logo-input').click()">
                <input type="file" id="logo-input" accept="image/*" onchange="handleLogoUpload(event)" hidden />
                <div class="logo-placeholder" id="logo-placeholder">
                  <i class="fas fa-cloud-upload-alt"></i>
                  <span>Upload Logo</span>
                </div>
                <img id="logo-preview" class="logo-preview" src="" alt="Logo" style="display:none;" />
              </div>
              <div class="form-row">
                <div class="form-group full">
                  <label>Company Name</label>
                  <input type="text" id="company-name" placeholder="Acme Corporation" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group full">
                  <label>Address</label>
                  <textarea id="company-address" rows="2" placeholder="123 Business St, Suite 100" oninput="updatePreview()"></textarea>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>City</label>
                  <input type="text" id="company-city" placeholder="New York" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>State / Region</label>
                  <input type="text" id="company-state" placeholder="NY" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Zip / Postal Code</label>
                  <input type="text" id="company-zip" placeholder="10001" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Country</label>
                  <input type="text" id="company-country" placeholder="United States" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" id="company-email" placeholder="billing@acme.com" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Phone</label>
                  <input type="text" id="company-phone" placeholder="+1 (555) 123-4567" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group full">
                  <label>Tax ID / VAT Number</label>
                  <input type="text" id="company-tax" placeholder="US-12345678" oninput="updatePreview()" />
                </div>
              </div>
            </section>

            <!-- Client / Recipient Details -->
            <section class="form-section">
              <h3><i class="fas fa-user"></i> Bill To / Recipient</h3>
              <div class="form-row">
                <div class="form-group full">
                  <label>Client Name</label>
                  <input type="text" id="client-name" placeholder="John Doe / XYZ Ltd" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group full">
                  <label>Address</label>
                  <textarea id="client-address" rows="2" placeholder="456 Client Ave" oninput="updatePreview()"></textarea>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>City</label>
                  <input type="text" id="client-city" placeholder="Los Angeles" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Country</label>
                  <input type="text" id="client-country" placeholder="United States" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" id="client-email" placeholder="john@example.com" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Account / Ref #</label>
                  <input type="text" id="client-account" placeholder="ACC-001234" oninput="updatePreview()" />
                </div>
              </div>
            </section>

            <!-- Document Details -->
            <section class="form-section">
              <h3><i class="fas fa-info-circle"></i> Document Details</h3>
              <div class="form-row">
                <div class="form-group">
                  <label id="doc-number-label">Invoice #</label>
                  <input type="text" id="doc-number" placeholder="INV-0001" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Date</label>
                  <input type="date" id="doc-date" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Due Date / Period End</label>
                  <input type="date" id="doc-due-date" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Currency</label>
                  <select id="doc-currency" onchange="updatePreview()">
                    <option value="$">USD ($)</option>
                    <option value="€">EUR (€)</option>
                    <option value="£">GBP (£)</option>
                    <option value="¥">JPY (¥)</option>
                    <option value="₹">INR (₹)</option>
                    <option value="R">ZAR (R)</option>
                    <option value="A$">AUD (A$)</option>
                    <option value="C$">CAD (C$)</option>
                    <option value="CHF">CHF (CHF)</option>
                    <option value="MK">MWK (MK)</option>
                    <option value="KSh">KES (KSh)</option>
                    <option value="TSh">TZS (TSh)</option>
                    <option value="USh">UGX (USh)</option>
                    <option value="ZMW">ZMW (ZMW)</option>
                  </select>
                </div>
              </div>
              <!-- Utility bill extra fields -->
              <div id="utility-fields" class="conditional-fields" style="display:none;">
                <div class="form-row">
                  <div class="form-group">
                    <label>Service Type</label>
                    <select id="utility-type" onchange="updatePreview()">
                      <option value="Electricity">Electricity</option>
                      <option value="Water">Water</option>
                      <option value="Gas">Gas</option>
                      <option value="Internet">Internet</option>
                      <option value="Telephone">Telephone</option>
                      <option value="Sewage">Sewage</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Meter Number</label>
                    <input type="text" id="meter-number" placeholder="MTR-9876543" oninput="updatePreview()" />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Previous Reading</label>
                    <input type="number" id="prev-reading" placeholder="12500" oninput="updatePreview()" />
                  </div>
                  <div class="form-group">
                    <label>Current Reading</label>
                    <input type="number" id="curr-reading" placeholder="13200" oninput="updatePreview()" />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Rate per Unit</label>
                    <input type="number" id="rate-per-unit" step="0.01" placeholder="0.12" oninput="updatePreview()" />
                  </div>
                  <div class="form-group">
                    <label>Unit</label>
                    <input type="text" id="utility-unit" placeholder="kWh" oninput="updatePreview()" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Line Items (for invoice/receipt/quote/statement/delivery) -->
            <section class="form-section" id="line-items-section">
              <h3><i class="fas fa-list"></i> Line Items</h3>
              <div id="line-items-container">
                <!-- dynamically added -->
              </div>
              <button class="btn btn-add" onclick="addLineItem()"><i class="fas fa-plus"></i> Add Item</button>
            </section>

            <!-- Tax & Discount -->
            <section class="form-section">
              <h3><i class="fas fa-percent"></i> Tax & Discount</h3>
              <div class="form-row">
                <div class="form-group">
                  <label>Tax Rate (%)</label>
                  <input type="number" id="tax-rate" value="0" step="0.5" min="0" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Discount (%)</label>
                  <input type="number" id="discount-rate" value="0" step="0.5" min="0" oninput="updatePreview()" />
                </div>
              </div>
            </section>

            <!-- Notes / Terms -->
            <section class="form-section">
              <h3><i class="fas fa-sticky-note"></i> Notes & Terms</h3>
              <div class="form-group full">
                <label>Notes</label>
                <textarea id="doc-notes" rows="3" placeholder="Thank you for your business!" oninput="updatePreview()"></textarea>
              </div>
              <div class="form-group full">
                <label>Terms & Conditions</label>
                <textarea id="doc-terms" rows="3" placeholder="Payment due within 30 days..." oninput="updatePreview()"></textarea>
              </div>
            </section>

            <!-- Payment Info -->
            <section class="form-section">
              <h3><i class="fas fa-credit-card"></i> Payment Details</h3>
              <div class="form-row">
                <div class="form-group">
                  <label>Bank Name</label>
                  <input type="text" id="bank-name" placeholder="National Bank" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Account Number</label>
                  <input type="text" id="bank-account" placeholder="1234567890" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Routing / Sort Code</label>
                  <input type="text" id="bank-routing" placeholder="021000021" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Payment Methods</label>
                  <input type="text" id="payment-methods" placeholder="Bank Transfer, PayPal, Check" oninput="updatePreview()" />
                </div>
              </div>
            </section>

            <!-- Appearance -->
            <section class="form-section">
              <h3><i class="fas fa-palette"></i> Appearance</h3>
              <div class="form-row">
                <div class="form-group">
                  <label>Primary Color</label>
                  <input type="color" id="primary-color" value="#2563eb" oninput="updatePreview()" />
                </div>
                <div class="form-group">
                  <label>Accent Color</label>
                  <input type="color" id="accent-color" value="#1e40af" oninput="updatePreview()" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Font Family</label>
                  <select id="font-family" onchange="updatePreview()">
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Arial', sans-serif">Arial</option>
                    <option value="'Georgia', serif">Georgia</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Font Size</label>
                  <select id="font-size" onchange="updatePreview()">
                    <option value="12px">Small (12px)</option>
                    <option value="14px" selected>Medium (14px)</option>
                    <option value="16px">Large (16px)</option>
                  </select>
                </div>
              </div>
            </section>
          </div>
        </div>

        <!-- Right Panel: Preview -->
        <div class="preview-panel">
          <div class="preview-toolbar">
            <span><i class="fas fa-eye"></i> Live Preview</span>
            <div>
              <button class="btn btn-sm" onclick="zoomPreview(-0.1)"><i class="fas fa-search-minus"></i></button>
              <span id="zoom-level">100%</span>
              <button class="btn btn-sm" onclick="zoomPreview(0.1)"><i class="fas fa-search-plus"></i></button>
            </div>
          </div>
          <div class="preview-scroll" id="preview-scroll">
            <div class="preview-page" id="preview-page">
              <div id="document-preview"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== ADVANCED VIEW ========== -->
    <div id="advanced-view" class="view-panel">
      <div class="advanced-layout">
        <!-- Code Editors -->
        <div class="editor-panel">
          <div class="editor-tabs">
            <button class="editor-tab active" data-tab="html" onclick="switchEditorTab('html')">
              <i class="fab fa-html5"></i> HTML
            </button>
            <button class="editor-tab" data-tab="css" onclick="switchEditorTab('css')">
              <i class="fab fa-css3-alt"></i> CSS
            </button>
          </div>
          <div class="editor-container">
            <textarea id="html-editor" class="code-editor active" spellcheck="false" oninput="updateAdvancedPreview()"></textarea>
            <textarea id="css-editor" class="code-editor" spellcheck="false" oninput="updateAdvancedPreview()"></textarea>
          </div>
          <div class="editor-actions">
            <button class="btn btn-sm btn-outline" onclick="loadCurrentToEditor()"><i class="fas fa-download"></i> Load from Simple View</button>
            <button class="btn btn-sm btn-outline" onclick="resetEditorToTemplate()"><i class="fas fa-undo"></i> Reset to Template</button>
            <button class="btn btn-sm btn-primary" onclick="applyAdvancedChanges()"><i class="fas fa-check"></i> Apply & Preview</button>
          </div>
        </div>
        <!-- Preview -->
        <div class="preview-panel">
          <div class="preview-toolbar">
            <span><i class="fas fa-eye"></i> Advanced Preview</span>
            <button class="btn btn-primary btn-sm" onclick="generatePDF()"><i class="fas fa-file-pdf"></i> Export PDF</button>
          </div>
          <div class="preview-scroll" id="advanced-preview-scroll">
            <div class="preview-page" id="advanced-preview-page">
              <div id="advanced-document-preview"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
